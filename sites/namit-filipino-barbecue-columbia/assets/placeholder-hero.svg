<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2940;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2c4a6e;stop-opacity:1"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <circle cx="600" cy="280" r="60" fill="rgba(255,255,255,0.06)"/>
  <rect x="520" y="240" width="160" height="80" rx="8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
